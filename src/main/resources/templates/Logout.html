<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignOut</title>
    <link rel="stylesheet" type="text/css" href="css/admin.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            height: 100vh;
            margin: 0;
        }
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .logout-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .logout-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .logout-container button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .logout-button {
            background-color: #d9534f;
            color: #fff;
        }
        .logout-button:hover {
            background-color: #c9302c;
        }
        .cancel-button {
            background-color: #6c757d;
            color: #fff;
        }
        .cancel-button:hover {
            background-color: #5a6268;
        }
        #logoutMessage {
            color: green;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="content">
    <div class="logout-container">
        <h2>Are you sure you want to Logout?</h2>
        <button id="logoutButton" class="logout-button">Yes, Logout</button>
        <button id="cancelButton" class="cancel-button">Cancel</button>
        <p id="logoutMessage">Logout Successful</p>
    </div>
</div>

<script>
    document.getElementById('logoutButton').addEventListener('click', function() {
        window.location.href = '/Login'; // Redirect to login on logout
    });

    document.getElementById('cancelButton').addEventListener('click', function() {
        window.location.href = '/Login'; // Redirect to login on cancel
    });
</script>
</body>
</html>
