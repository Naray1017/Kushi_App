<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignOut</title>
    <link rel="stylesheet" type="text/css" href="css/admin.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            height: 100vh;
            margin: 0;
        }
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .logout-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .logout-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .logout-container button {
            width: 100%;
            padding: 10px;
            background-color: #d9534f;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .logout-container button:hover {
            background-color: #c9302c;
        }
        #logoutMessage {
            color: green;
            display: none;
            margin-top: 10px;
        }
        .back-to-login {
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .back-to-login:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="logout-container">
            <h2>Are you sure you want to logout?</h2>
            <button id="logoutButton">Logout</button>
            <p id="logoutMessage">Logout Successful</p>
            <a href="/login" class="back-to-login">Back to Login</a>
        </div>
    </div>

    <script>
    document.getElementById('logoutButton').addEventListener('click', async function() {
        const response = await fetch('/log/logout', { method: 'POST' });

        if (response.ok) {
            window.location.href = '/guru'; // Immediately redirect after logout
        } else {
            window.location.href = '/login'; // Redirect to login if logout fails
        }
  
        });
    </script>
</body>
</html>
